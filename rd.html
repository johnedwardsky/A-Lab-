<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="menu.rd">A-LAB.TECH | R&D ЛАБОРАТОРИЯ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
            rel="stylesheet">
    </noscript>
    <style>
        :root {
            --bg: #030407;
            --surface: #0b0d14;
            --text: #ffffff;
            --accent: #FF2A2A;
            --tech-blue: #00E5FF;
            --border: rgba(255, 255, 255, 0.08);
            --font-main: 'Inter', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        
        

        html {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow-x: hidden;
            width: 100%;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* --- UI ELEMENTS --- */
        

        /* --- HEADER (Standardized) --- */
        header {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
            border-bottom: none;
            /* Remove border if present */
            backdrop-filter: none;
            /* Remove blur if present */
        }

        .header-controls {
            margin-left: auto;
            display: flex;
            gap: 15px;
            pointer-events: auto;
            z-index: 1100;
            align-items: center;
        }

        .logo {
            pointer-events: auto;
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 1100;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo img {
            height: 50px;
            width: auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 5px rgba(255, 42, 42, 0.2));
        }

        .logo:hover img {
            transform: scale(1.1);
        }

        .menu-btn,
        .back-btn {
            pointer-events: auto;
            position: relative;

            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-code);
            font-size: 0.8rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover,
        .back-btn:hover {
            background: transparent;
            border-color: #FF2A2A;
            color: #FF2A2A;
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.2);
            transform: translateY(-2px);
        }

        /* --- PREMIUM BUTTONS --- */
        .btn-action,
        .btn-primary,
        .btn-danger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 16px 36px;
            font-family: var(--font-code);
            font-weight: 700;
            font-size: 0.9rem;
            color: #000;
            background: linear-gradient(135deg, #00E5FF 0%, #0099AA 100%);
            border: none;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            text-decoration: none;
            cursor: pointer;
            z-index: 1;
        }

        .btn-action::before,
        .btn-primary::before,
        .btn-danger::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: rotate(45deg) translate(-100%, -100%);
            transition: 0.6s;
            z-index: -1;
        }

        .btn-action:hover,
        .btn-primary:hover,
        .btn-danger:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
            color: #000;
        }

        .btn-action:hover::before,
        .btn-primary:hover::before,
        .btn-danger:hover::before {
            transform: rotate(45deg) translate(100%, 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #FF2A2A 0%, #AA0000 100%);
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.3);
            color: #fff;
        }

        .btn-danger:hover {
            box-shadow: 0 0 30px rgba(255, 42, 42, 0.6);
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 150px 40px 100px;
        }


        /* --- HERO SECTION --- */
        .hero {
            margin-bottom: 120px;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.05) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
        }

        h1 {
            font-size: clamp(1.5rem, 8vw, 7rem);
            font-weight: 800;
            line-height: 0.9;
            text-transform: uppercase;
            margin-bottom: 30px;
            background: linear-gradient(180deg, #fff, #888);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-family: var(--font-code);
            color: var(--tech-blue);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 15px 30px;
            background: rgba(0, 229, 255, 0.05);
            backdrop-filter: blur(5px);
            position: relative;
        }

        .hero p::before,
        .hero p::after {
            content: '+';
            position: fixed;
            color: var(--tech-blue);
            font-size: 1.2rem;
        }

        .hero p::before {
            top: -10px;
            left: -6px;
        }

        .hero p::after {
            bottom: -10px;
            right: -6px;
        }

        /* --- SECTIONS --- */
        .section-header {
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 100px 0 50px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .section-title {
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-badge {
            font-family: var(--font-code);
            font-size: 0.8rem;
            padding: 5px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #888;
        }

        /* --- CARDS --- */
        .rd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr));
            gap: 40px;
        }


        .rd-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            display: flex;
            flex-direction: column;
        }

        /* Угловые маркеры для стиля "Лаборатория" */
        .rd-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border-top: 2px solid var(--border);
            border-left: 2px solid var(--border);
            transition: 0.3s;
            z-index: 2;
        }

        .rd-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            border-bottom: 2px solid var(--border);
            border-right: 2px solid var(--border);
            transition: 0.3s;
            z-index: 2;
        }

        .rd-card:hover {
            border-color: rgba(0, 229, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 229, 255, 0.1);
        }

        .rd-card:hover::before,
        .rd-card:hover::after {
            border-color: var(--tech-blue);
            width: 100%;
            height: 100%;
        }

        .card-image {
            height: 300px;
            width: 100%;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid var(--border);
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
            filter: grayscale(0.8) contrast(1.2);
        }

        .rd-card:hover .card-image img {
            transform: scale(1.05);
            filter: grayscale(0) contrast(1.1);
        }

        /* Сканирующая линия в картинке */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--tech-blue);
            box-shadow: 0 0 10px var(--tech-blue);
            opacity: 0;
            z-index: 5;
            pointer-events: none;
        }

        .rd-card:hover .scan-line {
            animation: scanImage 2s linear infinite;
            opacity: 1;
        }

        @keyframes scanImage {
            0% {
                top: 0;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* Data Grid Overlay */
        .data-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(0, 229, 255, 0.1) 19px, rgba(0, 229, 255, 0.1) 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(0, 229, 255, 0.1) 19px, rgba(0, 229, 255, 0.1) 20px);
            opacity: 0;
            z-index: 3;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .rd-card:hover .data-grid {
            opacity: 1;
        }

        /* Status Indicator */
        .status-indicator {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 10px;
            height: 10px;
            background: var(--tech-blue);
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 0 10px var(--tech-blue);
            opacity: 0;
            animation: pulse-indicator 2s infinite;
        }

        .rd-card:hover .status-indicator {
            opacity: 1;
        }

        @keyframes pulse-indicator {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        /* Holographic Effect */
        .holo-effect {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(0, 229, 255, 0.1),
                    transparent);
            z-index: 4;
            pointer-events: none;
            transition: left 0.6s;
        }

        .rd-card:hover .holo-effect {
            left: 100%;
        }

        .card-content {
            padding: 30px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .card-meta {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            font-family: var(--font-code);
            font-size: 0.7rem;
        }

        .meta-tag {
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            transition: all 0.3s;
        }

        .meta-tag.active {
            background: rgba(0, 229, 255, 0.1);
            color: var(--tech-blue);
        }

        .rd-card:hover .meta-tag.active {
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .rd-card h3 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .rd-card:hover h3 {
            color: var(--tech-blue);
        }

        .rd-card p {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 0.95rem;
            flex-grow: 1;
        }

        .tech-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .spec-item {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .spec-item::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--tech-blue);
            border-radius: 50%;
            transition: all 0.3s;
        }

        .rd-card:hover .spec-item {
            color: #aaa;
        }

        .rd-card:hover .spec-item::before {
            box-shadow: 0 0 8px var(--tech-blue);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.5);
            }
        }

        /* Loading Metrics Animation */
        .loading-metric {
            position: absolute;
            bottom: 15px;
            left: 15px;
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: var(--tech-blue);
            opacity: 0;
            z-index: 6;
            transition: opacity 0.3s;
        }

        .rd-card:hover .loading-metric {
            opacity: 1;
            animation: loadingText 2s infinite;
        }

        @keyframes loadingText {

            0%,
            100% {
                content: 'LOADING...';
            }

            33% {
                content: 'ANALYZING...';
            }

            66% {
                content: 'PROCESSING...';
            }
        }

        /* --- R&D FOOTER GRID --- */
        .rd-footer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin: 100px 0 150px;
        }

        .rd-card.stealth-section:hover::before,
        .rd-card.stealth-section:hover::after {
            border-color: var(--accent);
        }

        @media (max-width: 1024px) {
            .rd-footer-grid {
                grid-template-columns: 1fr;
                gap: 30px;
                margin: 40px 0 80px;
            }
        }

        /* --- FOOTER --- */
        footer {
            padding: 60px 40px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-family: var(--font-code);
            font-size: 0.8rem;
            color: #555;
            background: #050505;
        }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            .cursor {
                display: none !important;
            }

            

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: rgba(11, 13, 20, 0.9);
            border: 1px solid rgba(255, 42, 42, 0.3);
            padding: 50px;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 42, 42, 0.1);
            backdrop-filter: blur(20px);
            transform: scale(0.9);
            animation: scaleUp 0.3s forwards;
        }

        .nda-text-block {
            background: rgba(0, 229, 255, 0.03);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            font-size: 0.82rem;
            line-height: 1.6;
            color: #ccc;
            text-align: left;
        }

        .nda-text-block ul {
            margin: 10px 0 0 20px;
            padding: 0;
        }

        .nda-text-block li {
            margin-bottom: 6px;
        }

        @keyframes scaleUp {
            to {
                transform: scale(1);
            }
        }

        .close-modal {
            position: fixed;
            top: 25px;
            right: 25px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #666;
            transition: 0.3s;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-modal:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 18px 20px;
            border-radius: 12px;
            color: white;
            font-family: var(--font-main);
            margin-bottom: 20px;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-input::placeholder {
            color: #999;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 42, 42, 0.05);
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.1);
        }

        /* Checkbox Upgrade */
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 30px;
            cursor: pointer;
            padding: 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .checkbox-container:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .checkbox-container input {
            display: none;
        }

        .checkmark {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 0.3s;
        }

        .checkbox-container input:checked+.checkmark {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .checkbox-container input:checked+.checkmark::after {
            content: '✓';
            color: black;
            font-weight: bold;
            font-size: 14px;
        }

        /* Modern Slide Button */
        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: black;
            font-weight: 800;
            padding: 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-family: var(--font-code);
            font-size: 1rem;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(255, 42, 42, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(255, 42, 42, 0.5);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-loading {
            background: #333;
            color: #888;
            pointer-events: none;
        }

        /* Success Toast */
        .toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: var(--surface);
            border: 1px solid var(--tech-blue);
            padding: 20px 30px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
            color: var(--text);
            font-family: var(--font-code);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            transform: translateY(150px);
            opacity: 0;
            transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 11000;
            backdrop-filter: blur(10px);
        }

        .toast.active {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-icon {
            width: 35px;
            height: 35px;
            background: rgba(0, 229, 255, 0.1);
            color: var(--tech-blue);
            border: 1px solid var(--tech-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
    </style>

    


    <script>
        // --- NEURAL NETWORK ANIMATION ---
        const canvas = document.getElementById('neural-canvas');
        const aiCard = document.getElementById('ai-card');

        if (canvas && aiCard) {
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let animationFrame;

            function resize() {
                const rect = aiCard.querySelector('.card-image').getBoundingClientRect();
                width = canvas.width = rect.width;
                height = canvas.height = rect.height;
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * 1.5;
                    this.vy = (Math.random() - 0.5) * 1.5;
                    this.size = Math.random() * 2 + 1;
                }

                update() {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0, 229, 255, 0.9)';
                    ctx.fill();
                }
            }

            function initPars() {
                particles = [];
                for (let i = 0; i < 50; i++) { particles.push(new Particle()); }
            } function animate() {
                ctx.clearRect(0, 0,
                    width, height); particles.forEach((p, index) => {
                        p.update();
                        p.draw();

                        for (let j = index + 1; j < particles.length; j++) {
                            const p2 = particles[j]; const dist = Math.hypot(p.x -
                                p2.x, p.y - p2.y); if (dist < 100) {
                                    ctx.beginPath(); ctx.strokeStyle = `rgba(0, 229, 255, ${1 - dist
                                        / 100})`; ctx.lineWidth = 0.5; ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                                }
                        }
                    });
                animationFrame = requestAnimationFrame(animate);
            } window.addEventListener('load', () => {
                resize();
                initPars();
                animate();
            });

            window.addEventListener('resize', resize);

            aiCard.addEventListener('mouseenter', () => {
                canvas.style.opacity = '1';
            });

            aiCard.addEventListener('mouseleave', () => {
                canvas.style.opacity = '0';
            });
        }
    </script>
