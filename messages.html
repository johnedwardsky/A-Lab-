<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="menu.messages">A-LAB.CORE | СООБЩЕНИЯ</title>
    <link rel="stylesheet" href="resident-nav.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Inline cursor style removed -->
            
    <link rel="stylesheet" href="cursor.css">
</head>

<body>
    <!-- Navigation is injected by nav-manager.js -->

    <div class="messages-container">
        <div class="chat-sidebar">
            <div class="sidebar-header">
                <h2 style="font-size: 1.2rem; margin-bottom: 15px;">Messages</h2>
                <input type="text" class="search-chat" placeholder="Поиск контактов...">
            </div>
            <div class="chat-list" id="chatList">
                <div style="padding: 20px; text-align: center; color: #555; font-size: 0.8rem;">Загрузка списка
                    контактов...</div>
            </div>
        </div>

        <div class="message-window">
            <header class="window-header">
                <div class="active-user">
                    <div class="chat-avatar" style="width: 40px; height: 40px;">
                        <img decoding="async" src="assets/img/alex_river.png">
                    </div>
                    <div>
                        <div class="chat-name">Alex River</div>
                        <div style="display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: #555;">
                            <div class="status-dot online"></div> ONLINE
                        </div>
                    </div>
                </div>
                <div style="font-family: var(--font-code); font-size: 0.7rem; color: var(--tech-blue);">
                    ENCRYPTED_CHANNEL: [AES-256]
                </div>
            </header>

            <div class="msg-history" id="msgHistory">
                <div style="text-align: center; padding: 50px; color: #555; font-size: 0.85rem;">Выберите чат для начала
                    общения</div>
            </div>

            <div class="msg-input-area">
                <button class="hover-trigger"
                    style="background:transparent; border:none; color:#555; font-size:1.2rem;">📎</button>
                <input type="text" class="msg-input" placeholder="Напишите сообщение..." id="chatInput">
                <button class="send-btn hover-trigger" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="supabase-client.js"></script>
    <script defer src="auth-guard.js"></script>
    <script defer src="message-manager.js"></script>

    <!-- Old cursor script removed -->
    <script defer src="i18n.js"></script>
    <script defer src="nav-manager.js"></script>
            
    <script defer src="cursor.js"></script>
</body>

</html>
