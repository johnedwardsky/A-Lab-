<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>A-LAB.CORE | RESET_PORTAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #030407;
            --surface: #0b0d14;
            --text: #ffffff;
            --accent: #FF2A2A;
            --tech-blue: #00E5FF;
            --border: rgba(255, 255, 255, 0.08);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        a, button, input, select, textarea { cursor: pointer; }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: default;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 42, 42, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            filter: blur(100px);
        }

        .auth-container {
            width: 400px;
            background: rgba(11, 13, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 50px 40px;
            position: relative;
            z-index: 10;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .auth-logo img {
            height: 40px;
            margin-bottom: 20px;
        }

        .auth-logo h2 {
            font-family: var(--font-code);
            font-size: 0.8rem;
            color: var(--tech-blue);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-family: var(--font-main);
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-reset {
            width: 100%;
            background: var(--accent);
            color: black;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .error-msg,
        .success-msg {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .error-msg {
            background: rgba(255, 42, 42, 0.1);
            color: var(--accent);
            border: 1px solid rgba(255, 42, 42, 0.2);
        }

        .success-msg {
            background: rgba(0, 229, 255, 0.1);
            color: var(--tech-blue);
            border: 1px solid rgba(0, 229, 255, 0.2);
        }
    </style>
            
    <link rel="stylesheet" href="../cursor.css">
</head>

<body>
    <div class="bg-glow"></div>

    <div class="auth-container">
        <div class="auth-logo">
            <img decoding="async" src="../assets/img/A-lab-logo.svg" alt="A-LAB">
            <h2>RESET_PROTOCOL</h2>
        </div>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="resetForm">
            <div class="form-group">
                <label class="form-label">NEW_ENCRYPTION_KEY (new password)</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">CONFIRM_KEY</label>
                <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required
                    minlength="6">
            </div>
            <button type="submit" class="btn-reset">Update Password</button>
        </form>

        <div id="loginLink" style="display: none; text-align: center; margin-top: 20px;">
            <a href="login.html" style="color: var(--tech-blue); text-decoration: none; font-size: 0.8rem;">///
                INITIALIZE_LOGIN</a>
        </div>
    </div>

    <!-- SUPABASE & AUTH -->
    <script defer src="../assets/js/supabase.js"></script>
    <script defer src="../supabase-client.js"></script>
    <script defer src="../auth.js"></script>

    <script>
        const resetForm = document.getElementById('resetForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const loginLink = document.getElementById('loginLink');

        async function initReset() {
            const btn = resetForm.querySelector('button');
            const originalText = btn.innerText;

            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                errorMsg.style.display = 'none';
                successMsg.style.display = 'none';

                if (password !== confirmPassword) {
                    errorMsg.innerText = "Keys do not match.";
                    errorMsg.style.display = 'block';
                    return;
                }

                btn.innerText = 'UPDATING_ENCRYPTION...';
                btn.disabled = true;

                try {
                    if (!window.ALabAuth) {
                        await new Promise(r => setTimeout(r, 500));
                        if (!window.ALabAuth) throw new Error('AUTH_SYSTEM_OFFLINE');
                    }

                    // Check if session is actually present (Supabase should set it from URL hash)
                    const user = await window.ALabAuth.getUser();
                    if (!user) {
                        throw new Error('Auth session missing! Your recovery link might be expired or invalid. Please request a new link.');
                    }

                    const { data, error } = await window.ALabAuth.updatePassword(password);

                    if (error) {
                        throw error;
                    } else {
                        successMsg.innerText = 'Password updated successfully!';
                        successMsg.style.display = 'block';
                        resetForm.style.display = 'none';
                        loginLink.style.display = 'block';
                    }
                } catch (err) {
                    console.error('Reset Error:', err);
                    errorMsg.innerText = err.message || 'PROTOCOL_ERROR';
                    errorMsg.style.display = 'block';
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initReset);
        } else {
            initReset();
        }
    </script>
            
    <script defer src="../cursor.js"></script>
</body>

</html>
