<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title data-i18n="page_rd.air_bridges_title">A-LAB.TECH | ВОЗДУШНЫЕ МОСТЫ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #030407;
            --surface: #0b0d14;
            --text: #ffffff;
            --accent: #FF2A2A;
            --tech-blue: #00E5FF;
            --border: rgba(255, 255, 255, 0.08);
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
        }

        
        

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-main);
            overflow-x: hidden;
            background-image:
                linear-gradient(rgba(0, 229, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- UI ELEMENTS --- */
        

        /* --- HEADER (Standardized) --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none;
            backdrop-filter: none;
        }

        .header-controls {
            margin-left: auto;
            display: flex;
            gap: 15px;
            pointer-events: auto;
            z-index: 1100;
            align-items: center;
        }

        .logo {
            pointer-events: auto;
            position: fixed;
            top: 40px;
            left: 40px;
            z-index: 1100;
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo img {
            height: 50px;
            width: auto;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 5px rgba(255, 42, 42, 0.2));
        }

        .menu-btn,
        .back-btn {
            pointer-events: auto;
            position: relative;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-family: var(--font-code);
            font-size: 0.8rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .menu-btn:hover,
        .back-btn:hover {
            background: transparent;
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.2);
            transform: translateY(-2px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: clamp(100px, 15vw, 150px) 20px 50px;
        }

        /* --- HERO --- */
        .hero {
            margin-bottom: 80px;
            position: relative;
        }

        .project-tag {
            font-family: var(--font-code);
            color: var(--tech-blue);
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: block;
            letter-spacing: 2px;
        }

        h1 {
            font-size: clamp(1.5rem, 8.5vw, 5.5rem);
            font-weight: 800;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 30px;
            word-break: normal;
            overflow-wrap: normal;
            hyphens: none;
        }

        .hero-desc {
            max-width: 600px;
            color: #888;
            font-size: 1rem;
            line-height: 1.6;
            border-left: 2px solid var(--border);
            padding-left: 20px;
        }

        /* --- MAP & DRONE ANIMATION --- */
        .map-viewport {
            width: 100%;
            height: clamp(300px, 60vw, 600px);
            background: #000;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            border-radius: 0;
            margin-bottom: clamp(50px, 10vw, 100px);
            box-shadow: inset 0 0 50px rgba(0, 229, 255, 0.05);
        }

        #cyber-map {
            width: 100%;
            height: 100%;
            display: block;
        }

        .map-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .map-status {
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: var(--tech-blue);
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border: 1px solid var(--border);
        }

        .terrain-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px;
            height: 120px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--tech-blue);
            z-index: 15;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 768px) {
            .terrain-preview {
                position: static;
                width: 100%;
                height: 150px;
                margin-top: 10px;
                border-radius: 0;
            }
        }

        .preview-header {
            font-family: var(--font-code);
            font-size: 0.6rem;
            background: rgba(0, 229, 255, 0.1);
            color: var(--tech-blue);
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
        }

        .preview-content {
            flex-grow: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Terrain Visuals */
        .terrain-viz {
            width: 100%;
            height: 100%;
            display: none;
            position: relative;
        }

        .terrain-viz.active {
            display: block;
        }

        .terrain-label {
            position: absolute;
            bottom: 5px;
            left: 5px;
            font-family: var(--font-code);
            font-size: 0.6rem;
            color: #fff;
            text-shadow: 0 0 5px #000;
        }

        .scan-bar-mini {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--tech-blue);
            box-shadow: 0 0 5px var(--tech-blue);
            animation: scan-mini 2s linear infinite;
        }

        @keyframes scan-mini {
            0% {
                top: 0;
            }

            100% {
                top: 100%;
            }
        }

        /* Drone CSS Simulation */
        .drone-container {
            position: absolute;
            width: 80px;
            height: 50px;
            z-index: 20;
            pointer-events: none;
            transition: transform 0.1s linear;
            transform: translate(-50%, -50%);
        }

        .drone-body {
            position: absolute;
            width: 40px;
            height: 15px;
            background: #222;
            border: 1px solid #444;
            left: 20px;
            top: 17px;
            border-radius: 20px;
        }

        .drone-rotor {
            position: absolute;
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: spin 0.1s linear infinite;
        }

        .rotor-l {
            left: 0;
            top: 12px;
        }

        .rotor-r {
            right: 0;
            top: 12px;
        }

        .cargo {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--tech-blue);
            left: 30px;
            bottom: -5px;
            box-shadow: 0 0 10px var(--tech-blue);
            opacity: 0.8;
            transition: transform 0.3s;
        }

        /* --- INTEL VIEW --- */
        .intel-container {
            margin-bottom: 100px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.5s;
        }

        .intel-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .intel-image {
            width: 100%;
            height: 400px;
            background: #000;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        @media (max-width: 768px) {
            .intel-container {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-bottom: 60px;
            }

            .intel-image {
                height: 250px;
            }
        }

        #intel-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(180deg, transparent, var(--tech-blue), transparent);
            box-shadow: 0 0 15px var(--tech-blue);
            animation: intel-scan 3s linear infinite;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes intel-scan {
            0% {
                top: -10%;
            }

            100% {
                top: 110%;
            }
        }

        .intel-details h2 {
            font-family: var(--font-code);
            font-size: 1.5rem;
            color: var(--tech-blue);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .intel-details p {
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .intel-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .intel-spec-item {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: #666;
            padding: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }

        .terrain-viz img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        @keyframes spin {
            0% {
                transform: rotateY(0deg);
            }

            100% {
                transform: rotateY(360deg);
            }
        }

        /* --- INNOVATIONS GRID --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 100px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .sector-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 30px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .sector-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, transparent 50%, rgba(255, 42, 42, 0.1) 50%);
        }

        .sector-card:hover {
            border-color: var(--tech-blue);
            background: rgba(0, 229, 255, 0.03);
            transform: translateY(-5px);
        }

        .sector-card h3 {
            font-family: var(--font-code);
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--tech-blue);
            text-transform: uppercase;
        }

        .sector-card p {
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .sector-icon {
            font-size: 2rem;
            margin-bottom: 20px;
            display: block;
            height: 60px;
            width: 100%;
        }

        .sector-icon img {
            height: 100%;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.3));
        }

        /* --- SPECS --- */
        .specs-bar {
            display: flex;
            justify-content: space-between;
            border: 1px solid var(--border);
            padding: 40px;
            background: #000;
            margin-bottom: 100px;
        }

        .spec {
            text-align: center;
        }

        .spec-val {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            display: block;
            font-family: var(--font-code);
        }

        .spec-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        /* --- PoE BLOCK --- */
        .poe-block {
            margin: 0 auto 80px;
            max-width: 900px;
            padding: 40px;
            background: rgba(0, 229, 255, 0.03);
            border: 1px solid rgba(0, 229, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .poe-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--tech-blue), transparent);
        }

        .poe-tag {
            font-family: var(--font-code);
            font-size: 0.75rem;
            color: var(--tech-blue);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
            opacity: 0.8;
        }

        .poe-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .poe-desc {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .poe-hash-row {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.15);
            padding: 16px 20px;
            margin-bottom: 16px;
        }

        .poe-hash-label {
            font-family: var(--font-code);
            font-size: 0.65rem;
            color: var(--tech-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            min-width: 70px;
        }

        .poe-hash-value {
            font-family: var(--font-code);
            font-size: 0.72rem;
            color: rgba(0, 229, 255, 0.9);
            word-break: break-all;
            line-height: 1.5;
        }

        .poe-meta {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .poe-meta-item {
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: #555;
        }

        .poe-meta-item span {
            color: rgba(0, 229, 255, 0.7);
        }

        footer {
            padding: 60px 40px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            font-family: var(--font-code);
            font-size: 0.8rem;
            color: #555;
        }

        @media (max-width: 768px) {
            .specs-bar {
                flex-direction: column;
                gap: 40px;
            }
        }

        /* --- VR HUD SECTION --- */
        .vr-control-section {
            margin-bottom: 150px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            padding: 2px;
            position: relative;
            overflow: hidden;
        }

        .vr-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            padding: 40px;
            align-items: center;
        }

        @media (max-width: 1024px) {
            .vr-container {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .vr-hud-view {
                height: 50vh;
            }

            .vr-info h2 {
                font-size: clamp(1.8rem, 8vw, 3rem);
            }

            .vr-control-section {
                margin-bottom: 80px;
            }
        }

        .vr-hud-view {
            position: relative;
            width: 100%;
            height: 500px;
            background: #000;
            overflow: hidden;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
        }

        .vr-hud-view img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: transform 0.05s linear;
        }

        .hud-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: var(--tech-blue);
        }

        .hud-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 50%;
        }

        .hud-reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            border: 2px solid var(--tech-blue);
            transform: translate(-50%, -50%);
        }

        .hud-reticle::after,
        .hud-reticle::before {
            content: '';
            position: absolute;
            background: var(--tech-blue);
        }

        .hud-reticle::before {
            top: 50%;
            left: -10px;
            width: 60px;
            height: 1px;
        }

        .hud-reticle::after {
            left: 50%;
            top: -10px;
            width: 1px;
            height: 60px;
        }

        .hud-pitch-ladder {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 200px;
            transform: translate(-50%, -50%);
            border-left: 2px solid rgba(0, 229, 255, 0.3);
            border-right: 2px solid rgba(0, 229, 255, 0.3);
        }

        .pitch-line {
            width: 100%;
            height: 1px;
            background: rgba(0, 229, 255, 0.2);
            margin: 20px 0;
        }

        .hud-side-bar {
            width: 60px;
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.2);
            font-family: var(--font-code);
            font-size: 0.6rem;
            color: var(--tech-blue);
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 60%, rgba(0, 0, 0, 0.6) 100%);
            pointer-events: none;
            z-index: 6;
        }

        .vr-info h2 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: 800;
            line-height: 1;
        }

        .vr-feature {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .vr-feature-icon {
            font-size: 1.5rem;
            color: var(--accent);
        }

        .vr-feature-text h4 {
            font-family: var(--font-code);
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: var(--tech-blue);
        }

        .vr-feature-text p {
            font-size: 0.85rem;
            color: #888;
            line-height: 1.4;
        }

        .neural-link-active {
            color: #00FF41;
            font-family: var(--font-code);
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #00FF41;
            border-radius: 50%;
            box-shadow: 0 0 10px #00FF41;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        /* --- CONTACT FORM --- */
        .contact-section {
            margin-bottom: 150px;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 60px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .contact-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--tech-blue);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .grid-span-2 {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-label {
            font-family: var(--font-code);
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 1px;
        }

        .form-input,
        .form-textarea {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            padding: 15px;
            color: white;
            font-family: var(--font-main);
            outline: none;
            transition: 0.3s;
            width: 100%;
        }

        .form-input:hover,
        .form-textarea:hover {
            border-color: rgba(0, 229, 255, 0.3);
        }

        .form-input:focus,
        .form-textarea:focus {
            border-color: var(--tech-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
            background: rgba(0, 0, 0, 0.7);
        }

        .submit-btn {
            background: transparent;
            border: 1px solid var(--tech-blue);
            color: var(--tech-blue);
            padding: 15px 40px;
            font-family: var(--font-code);
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
            width: auto;
        }

        .submit-btn:hover {
            background: var(--tech-blue);
            color: black;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        @media (max-width: 768px) {
            .cursor {
                display: none !important;
            }

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

        document.querySelectorAll('.hover-trigger').forEach(el => {

            el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });

        // CYBER MAP CANVAS
        const canvas = document.getElementById('cyber-map');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = canvas.offsetWidth;
            height = canvas.height = canvas.offsetHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Simplified continent data (scaled 0-1)
        const continents = [
            // North America
            [{ x: 0.1, y: 0.2 }, { x: 0.3, y: 0.2 }, { x: 0.3, y: 0.4 }, { x: 0.2, y: 0.5 }],
            // South America
            [{ x: 0.25, y: 0.55 }, { x: 0.35, y: 0.55 }, { x: 0.35, y: 0.8 }, { x: 0.3, y: 0.9 }],
            // Eurasia
            [{ x: 0.45, y: 0.15 }, { x: 0.85, y: 0.15 }, { x: 0.9, y: 0.4 }, { x: 0.5, y: 0.5 }],
            // Africa
            [{ x: 0.45, y: 0.55 }, { x: 0.6, y: 0.55 }, { x: 0.6, y: 0.85 }, { x: 0.5, y: 0.8 }],
            // Australia
            [{ x: 0.8, y: 0.65 }, { x: 0.9, y: 0.65 }, { x: 0.9, y: 0.8 }, { x: 0.8, y: 0.8 }]
        ];

        const dots = [];
        continents.forEach(poly => {
            for (let i = 0; i < 30; i++) {
                // Random point inside bounding box of poly
                let minX = Math.min(...poly.map(p => p.x));
                let maxX = Math.max(...poly.map(p => p.x));
                let minY = Math.min(...poly.map(p => p.y));
                let maxY = Math.max(...poly.map(p => p.y));

                dots.push({
                    x: minX + Math.random() * (maxX - minX),
                    y: minY + Math.random() * (maxY - minY),
                    size: 1 + Math.random() * 2
                });
            }
        });

        const hubs = [
            { x: 0.2, y: 0.3, label: 'SECTOR_AGRI', viz: 'agri' },
            { x: 0.5, y: 0.4, label: 'SECTOR_MOUNTAIN', viz: 'mountain' },
            { x: 0.8, y: 0.25, label: 'SECTOR_ARCTIC', viz: 'arctic' },
            { x: 0.55, y: 0.75, label: 'SECTOR_RESEARCH', viz: 'research', critical: true }
        ];

        let tick = 0;
        function drawMap() {
            ctx.clearRect(0, 0, width, height);
            tick++;

            // WORLD SHADER (Tech Deep Blue)
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#020408');
            bgGradient.addColorStop(1, '#050a14');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // TACTICAL GRID SYSTEM

            // 1. Minor Sub-grid (20px)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.08)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < width; x += 20) {
                ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, height);
            }
            for (let y = 0; y < height; y += 20) {
                ctx.moveTo(0, y + 0.5); ctx.lineTo(width, y + 0.5);
            }
            ctx.stroke();

            // 2. Major Navigation Grid (100px)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.2)'; // More visible
            ctx.lineWidth = 1;

            ctx.font = '9px JetBrains Mono';
            ctx.fillStyle = 'rgba(0, 229, 255, 0.5)';

            for (let x = 0; x < width; x += 100) {
                ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, height);
                // Longitude markers
                if (x > 0) ctx.fillText('E' + (x / 10).toFixed(0) + '°', x + 4, 12);
            }
            for (let y = 0; y < height; y += 100) {
                ctx.moveTo(0, y + 0.5); ctx.lineTo(width, y + 0.5);
                // Latitude markers
                if (y > 0) ctx.fillText('N' + (y / 10).toFixed(0) + '°', 4, y - 4);
            }
            ctx.stroke();

            // 3. Grid Intersections (Crosshairs)
            ctx.fillStyle = 'rgba(0, 229, 255, 0.6)';
            for (let x = 0; x < width; x += 100) {
                for (let y = 0; y < height; y += 100) {
                    ctx.fillRect(x - 1, y - 4, 2, 8); // Vertical part
                    ctx.fillRect(x - 4, y - 1, 8, 2); // Horizontal part
                }
            }

            // Hologram Islands (More explicit)
            ctx.save();
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'rgba(0, 150, 255, 0.6)';

            continents.forEach(poly => {
                ctx.beginPath();
                ctx.moveTo(poly[0].x * width, poly[0].y * height);
                for (let i = 1; i < poly.length; i++) {
                    ctx.lineTo(poly[i].x * width, poly[i].y * height);
                }
                ctx.closePath();

                // Solid hologram fill
                const gradient = ctx.createLinearGradient(0, 0, width, height);
                gradient.addColorStop(0, 'rgba(0, 229, 255, 0.15)'); // Brighter start
                gradient.addColorStop(1, 'rgba(0, 100, 255, 0.08)'); // Brighter end
                ctx.fillStyle = gradient;
                ctx.fill();

                // Stronger border
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Inner "contours" for detail
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.1)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    // Simplified internal lines
                    let scale = 0.8 - (i * 0.15);
                    let cx = poly.reduce((a, b) => a + b.x, 0) / poly.length * width;
                    let cy = poly.reduce((a, b) => a + b.y, 0) / poly.length * height;

                    ctx.moveTo(cx + (poly[0].x * width - cx) * scale, cy + (poly[0].y * height - cy) * scale);
                    for (let j = 1; j < poly.length; j++) {
                        ctx.lineTo(cx + (poly[j].x * width - cx) * scale, cy + (poly[j].y * height - cy) * scale);
                    }
                    ctx.closePath();
                    ctx.stroke();
                }
            });
            ctx.restore();

            // Dots (Continents) - More visible
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)'; // Increased opacity
            dots.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x * width, p.y * height, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Hubs
            hubs.forEach(h => {
                const hx = h.x * width;
                const hy = h.y * height;

                const isCritical = h.critical && Math.sin(tick * 0.1) > 0;
                const color = h.critical ? (isCritical ? 'var(--accent)' : 'rgba(255, 42, 42, 0.3)') : 'var(--tech-blue)';
                const glowColor = h.critical ? 'rgba(255, 42, 42, 0.5)' : 'rgba(0, 229, 255, 0.5)';

                // Central point
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(hx, hy, 4, 0, Math.PI * 2);
                ctx.fill();

                // Outer ring
                ctx.strokeStyle = glowColor;
                ctx.lineWidth = h.critical ? 2 : 1;
                ctx.beginPath();
                ctx.arc(hx, hy, 12 + (h.critical ? Math.sin(tick * 0.1) * 3 : 0), 0, Math.PI * 2);
                ctx.stroke();

                // Label
                ctx.fillStyle = color;
                ctx.font = '8px JetBrains Mono';
                ctx.fillText(h.label, hx + 15, hy + 5);

                if (h.critical && isCritical) {
                    ctx.font = '7px JetBrains Mono';
                    ctx.fillText('CRITICAL_ALERT', hx + 15, hy + 15);
                }
            });
        }

        // DRONE LOGIC
        const drone = document.getElementById('drone');
        const cargo = document.getElementById('cargo');
        const destLabel = document.getElementById('dest-label');
        const coordLabel = document.getElementById('coord-label');

        let dronePos = { x: hubs[0].x * width, y: hubs[0].y * height };
        let targetPos = { x: hubs[0].x * width, y: hubs[0].y * height };
        let state = 'IDLE'; // IDLE, LIFTING, DELIVERING, DROPPING

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            targetPos.x = e.clientX - rect.left;
            targetPos.y = e.clientY - rect.top;

            destLabel.innerText = `X:${Math.round(targetPos.x)} Y:${Math.round(targetPos.y)}`;
            if (state === 'IDLE') state = 'LIFTING';
        });

        const intelData = {
            agri: {
                title: "Бангладеш: Рисовые поля",
                desc: "Затопленные рисовые террасы. Сложная логистика из-за водного ландшафта. Идеальные условия для тестирования посадки на воду.",
                img: "assets/img/agri_bangladesh_rice_fields_1771057457856.png",
                id: "BGD_RICE_ZONE",
                stats: ["WATER_LVL: HIGH", "HUMIDITY: 95%", "CROP_HEALTH: OPTIMAL", "NAV_MODE: AQUA"]
            },
            mountain: {
                title: "Непал: Высокогорье",
                desc: "Гималайский хребет. Разряженный воздух и сильные восходящие потоки. Тестирование грузоподъемности на высоте 4000м+.",
                img: "assets/img/logistic_nepal_mountains_1771057480166.png",
                id: "NPL_HIGHLANDS",
                stats: ["ALTITUDE: 4200m", "OXYGEN: 60%", "WIND_GUSTS: 25m/s", "TERRAIN: EXTREME"]
            },
            arctic: {
                title: "Арктика: Полярный город",
                desc: "Замерзшая береговая линия и модульное поселение. Экстремально низкие температуры. Проверка систем обогрева аккумуляторов.",
                img: "assets/img/arctic_city_shores_1771057497816.png",
                id: "ARC_BASE_ALPHA",
                stats: ["TEMP: -55°C", "ICE_DESERT", "POLAR_NIGHT", "BATTERY: CRITICAL"]
            },
            research: {
                title: "Океан: Глубоководный зонд",
                desc: "Развертывание подводного кабеля связи. Дрон удерживает линию передачи данных, уходящую в бездну океана.",
                img: "assets/img/research_drone_ocean_cable_1771057514945.png",
                id: "OCEAN_LINK_OPS",
                stats: ["DEPTH: UNKNOWN", "CABLE_TENSION: OK", "WAVES: 3m", "LINK: ACTIVE"]
            }
        };

        function updateTerrainPreview() {
            let closestHub = null;
            let minDist = 60;

            hubs.forEach(h => {
                const hx = h.x * width;
                const hy = h.y * height;
                const d = Math.sqrt((hx - dronePos.x) ** 2 + (hy - dronePos.y) ** 2);
                if (d < minDist) {
                    minDist = d;
                    closestHub = h;
                }
            });

            const vizs = document.querySelectorAll('.terrain-viz');
            vizs.forEach(v => v.classList.remove('active'));

            const intelView = document.getElementById('intel-view');

            if (closestHub) {
                document.getElementById('viz-' + closestHub.viz).classList.add('active');

                // Update Intel Section
                const data = intelData[closestHub.viz];
                document.getElementById('intel-img').src = data.img;
                document.getElementById('intel-title').innerText = data.title;
                document.getElementById('intel-desc').innerText = data.desc;
                document.getElementById('intel-sector-id').innerText = data.id;

                const statsDivs = document.querySelectorAll('.intel-spec-item');
                data.stats.forEach((s, i) => {
                    if (statsDivs[i]) statsDivs[i].innerText = s;
                });

                intelView.classList.add('visible');
            } else {
                document.getElementById('viz-default').classList.add('active');
                intelView.classList.remove('visible');
            }
        }

        function updateDrone() {
            const dx = targetPos.x - dronePos.x;
            const dy = targetPos.y - dronePos.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 2) {
                dronePos.x += dx * 0.02;
                dronePos.y += dy * 0.02;

                // Tilt drone
                const tilt = Math.min(Math.max(dx * 0.1, -15), 15);
                drone.style.transform = `translate(-50%, -50%) rotate(${tilt}deg)`;
            } else {
                state = 'IDLE';
                drone.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            }

            drone.style.left = dronePos.x + 'px';
            drone.style.top = dronePos.y + 'px';

            coordLabel.innerText = `${(dronePos.x / width).toFixed(2)}, ${(dronePos.y / height).toFixed(2)}`;
            updateTerrainPreview();

            // Connection line to target
            if (dist > 5) {
                ctx.setLineDash([5, 5]);
                ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
                ctx.beginPath();
                ctx.moveTo(dronePos.x, dronePos.y);
                ctx.lineTo(targetPos.x, targetPos.y);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        const vrHud = document.getElementById('vr-hud');
        const vrHorizon = document.getElementById('hud-horizon-bg');
        const vrSpd = document.getElementById('vr-spd');
        const vrAlt = document.getElementById('vr-alt');
        const vrPwr = document.getElementById('vr-pwr');
        const vrHdg = document.getElementById('vr-hdg');
        const compassStrip = document.getElementById('compass-strip');
        const locker = document.getElementById('hud-locker');
        const glitch = document.getElementById('hud-glitch');
        const statusMsg = document.getElementById('hud-status-msg');
        const pitchLadder = document.getElementById('pitch-ladder');
        const vrMode = document.getElementById('vr-mode');

        let lastX = 0, lastY = 0;
        let targetLockerX = 0, targetLockerY = 0;
        let currentHdg = 285;
        let isLocked = false;

        vrHud.addEventListener('mousemove', (e) => {
            const rect = vrHud.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;

            // Glitch effect on sudden movement
            const delta = Math.abs(x - lastX) + Math.abs(y - lastY);
            if (delta > 0.05) {
                glitch.style.opacity = "0.2";
                setTimeout(() => glitch.style.opacity = "0", 50);
            }
            lastX = x; lastY = y;

            // 3D Tilt for the whole prototype
            const tiltX = -y * 15;
            const tiltY = x * 15;
            vrHud.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

            // Artificial Horizon logic (Roll and Pitch)
            const roll = x * 20; // Angle of bank
            const pitch = -y * 100; // Pitch up/down
            vrHorizon.style.transform = `translate(-50%, calc(-50% + ${pitch}px)) rotate(${roll}deg)`;

            // Pitch ladder sync
            pitchLadder.style.transform = `translate(-50%, calc(-50% + ${-y * 50}px)) rotate(${x * 15}deg)`;

            // Dynamic Compass
            currentHdg = (285 + (x * 90) + 360) % 360;
            vrHdg.innerText = `HDG: ${Math.round(currentHdg)}° [${getDirection(currentHdg)}]`;
            compassStrip.style.transform = `translateX(${-(x * 200)}px)`;

            // Locker follows with delay
            targetLockerX = e.clientX - rect.left;
            targetLockerY = e.clientY - rect.top;

            if (!isLocked) {
                locker.style.opacity = "0.6";
                locker.style.left = (targetLockerX - 30) + "px";
                locker.style.top = (targetLockerY - 30) + "px";
            }

            // Randomize metrics slightly for "live" feel
            if (Math.random() > 0.9) {
                vrSpd.innerText = (350 + Math.floor(Math.random() * 15 - 5));
                vrAlt.innerText = `ALT: ${2500 + Math.floor(Math.random() * 30 - 15)}m`;
                vrPwr.innerText = (70 + Math.floor(Math.random() * 5)) + "%";
            }
        });

        vrHud.addEventListener('click', (e) => {
            isLocked = !isLocked;
            if (isLocked) {
                locker.style.borderColor = "var(--accent)";
                locker.querySelector('div').innerText = "OBJECT_LOCKED";
                locker.querySelector('div').style.color = "var(--accent)";
                statusMsg.innerHTML = "SYSTEM: ACQUIRED<br>TRACKING: ACTIVE<br>THREAT: ANALYZING";
                statusMsg.style.color = "var(--accent)";
                vrMode.innerText = "TACTICAL_LOCK";
                vrMode.style.color = "var(--accent)";

                // Sound-like burst effect
                glitch.style.opacity = "0.3";
                setTimeout(() => glitch.style.opacity = "0", 100);
            } else {
                locker.style.borderColor = "var(--tech-blue)";
                locker.querySelector('div').innerText = "LOCKING...";
                locker.querySelector('div').style.color = "var(--tech-blue)";
                statusMsg.innerHTML = "SYSTEM: READY<br>LINK: ENCRYPTED<br>BATTERY: 88%";
                statusMsg.style.color = "#00FF41";
                vrMode.innerText = "MANUAL_OVERRIDE";
                vrMode.style.color = "var(--tech-blue)";
            }
        });

        vrHud.addEventListener('mouseleave', () => {
            vrHud.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
            pitchLadder.style.transform = `translate(-50%, -50%) rotate(0deg)`;
            locker.style.opacity = "0";
            isLocked = false;
        });

        function getDirection(deg) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return dirs[Math.round(deg / 45) % 8];
        }

        function animate() {
            drawMap();
            updateDrone();
            requestAnimationFrame(animate);
        }

        animate();

        // Interest Form Submission
        const interestForm = document.getElementById('interest-form');
        interestForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = interestForm.querySelector('.submit-btn');
            const originalText = btn.innerText;

            btn.innerText = 'SENDING...';
            btn.style.opacity = '0.5';
            btn.style.pointerEvents = 'none';

            // Simulate server lag
            setTimeout(() => {
                btn.innerText = 'DATA_RECEIVED';
                btn.style.borderColor = '#00FF41';
                btn.style.color = '#00FF41';
                btn.style.opacity = '1';

                alert('Запрос отправлен в систему A-LAB. Мы свяжемся с вами в ближайшее время.');
                interestForm.reset();

                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.borderColor = 'var(--tech-blue)';
                    btn.style.color = 'var(--tech-blue)';
                    btn.style.pointerEvents = 'all';
                }, 3000);
            }, 1500);
        });

    </script>
